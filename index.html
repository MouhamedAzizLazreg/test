<script>
  window. chatwootSettings = {
    "position": "right",
    "type": "expanded_bubble",
    "launcherTitle": "Chat with us",
    "showPopoutButton": false  // Optional: hides the popout button
  };
  
  (function(d,t) {
    var BASE_URL="https://app.ask-innovation.com";
    var g=d.createElement(t),s=d.getElementsByTagName(t)[0];
    g.src=BASE_URL+"/packs/js/sdk.js";
    g.async = true;
    s.parentNode.insertBefore(g,s);
    g.onload=function(){
      window.chatwootSDK.run({
        websiteToken: 'mU6WbuBjTPvyeZjG8T86Xh87',
        baseUrl: BASE_URL
      });
      
      // Auto-open the widget after SDK loads
      window.addEventListener('chatwoot:ready', function() {
        window.$chatwoot.toggle('open');
        
        // Optional: Prevent closing (removes close button functionality)
        // This requires custom CSS to hide the close button
      });
    };
    
    window. addEventListener('chatwoot:ready', function() {
      window.$chatwoot.setCustomAttributes({
        source_site: window.location.hostname
      });
    });
  })(document,"script");
</script>
